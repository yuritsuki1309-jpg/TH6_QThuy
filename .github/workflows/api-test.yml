name: GoRest CI Pipeline
 
on: [push]
 
jobs:
  api-testing:
    runs-on: ubuntu-latest
 
    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4
 
      - name: 2. Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
 
      - name: 3. Cài đặt Newman (Postman CLI)
        run: npm install -g newman
 
      - name: 4. Chạy Collection với dữ liệu CSV
        run: |
          newman run GoRest.postman_collection.json \
            -e 2274802010869_HoTranQuangThuy_GoRest_Env.postman_environment.json \
            --env-var "token=${{ secrets.GOREST_TOKEN }}" \
            -d users.csv
